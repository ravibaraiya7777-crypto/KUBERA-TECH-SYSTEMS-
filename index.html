<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KUBERA TECH SYSTEMS - Work Management</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#0f172a
}
header{
  background:#0f172a;
  color:#fff;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center
}
.brand{font-size:20px;font-weight:700}
.muted{color:#64748b;font-size:13px}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  background:#2563eb;
  color:#fff;
  font-weight:700;
  cursor:pointer
}
button.secondary{background:#475569}
button.danger{background:#dc2626}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px
}
.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 15px #0000000d
}
input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  margin-top:6px;
  background:#fff
}
label{
  font-size:13px;
  font-weight:700;
  display:block;
  margin-top:13px
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px
}
.full{grid-column:1/-1}
.hidden{display:none}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px
}
.stat{
  background:#fff;
  padding:18px;
  border-radius:14px
}
.stat b{
  font-size:28px;
  display:block;
  margin-top:6px
}

.work{
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:15px;
  margin-top:12px
}
.worktop{
  display:flex;
  justify-content:space-between;
  gap:10px
}
.badge{
  padding:5px 9px;
  border-radius:20px;
  background:#dbeafe;
  color:#1d4ed8;
  font-size:12px;
  font-weight:bold
}

.login{
  max-width:430px;
  margin:60px auto
}
.tabs{
  display:flex;
  gap:8px;
  margin-bottom:15px
}
.tabs button{flex:1}

.error{
  color:#dc2626;
  font-size:13px;
  margin-top:10px
}
.success{
  color:#15803d;
  font-size:13px;
  margin-top:10px
}

.invoice-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px
}
.invoice-item{
  display:grid;
  grid-template-columns:2fr 90px 120px 120px 44px;
  gap:8px;
  align-items:end;
  margin-top:8px
}
.invoice-total{
  max-width:420px;
  margin-left:auto;
  margin-top:15px
}
.invoice-row{
  display:flex;
  justify-content:space-between;
  padding:6px 0
}
.invoice-grand{
  font-size:20px;
  font-weight:800;
  border-top:2px solid #0f172a;
  padding-top:10px
}
.invoice-card{
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:15px;
  margin-top:12px
}

@media(max-width:700px){
  .grid,.stats{grid-template-columns:1fr}
  .full{grid-column:auto}
  header{padding:14px}
  .container{padding:12px}
  .invoice-item{
    grid-template-columns:1fr 80px 100px 100px 44px;
    overflow-x:auto
  }
  .invoice-total{max-width:none}
}

@media print{
  body *{visibility:hidden!important}
  #printInvoice,#printInvoice *{
    visibility:visible!important
  }
  #printInvoice{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    background:#fff;
    padding:25px
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage" class="container">

<div class="card login">

<div style="font-size:26px;font-weight:800">
KUBERA TECH SYSTEMS
</div>

<p class="muted">
Worker Work Management
</p>

<div class="tabs">

<button onclick="showLogin()">
Login
</button>

<button
class="secondary"
onclick="showRegister()">
Create Account
</button>

</div>

<div id="authForm">

<label>Email</label>

<input
id="email"
type="email"
placeholder="Email">

<label>Password</label>

<input
id="password"
type="password"
placeholder="Password">

<button
style="width:100%;margin-top:18px"
onclick="login()">
Login
</button>

<div id="authMsg"></div>

</div>

</div>
</div>


<!-- ================= APP ================= -->

<div id="app" class="hidden">

<header>

<div>

<div class="brand">
KUBERA TECH SYSTEMS
</div>

<div
id="roleText"
class="muted"
style="color:#cbd5e1">
</div>

</div>

<div style="display:flex;gap:8px;align-items:center">

<button
id="invoiceNav"
class="secondary hidden"
onclick="showInvoices()">
🧾 Invoices
</button>

<button
class="secondary"
onclick="logout()">
Logout
</button>

</div>

</header>


<div class="container">

<!-- ================= STATS ================= -->

<div class="stats">

<div class="stat">
Total Work
<b id="totalCount">0</b>
</div>

<div class="stat">
Pending
<b id="pendingCount">0</b>
</div>

<div class="stat">
Completed
<b id="completedCount">0</b>
</div>

</div>


<!-- ================= ADD WORK ================= -->

<div class="card">

<h2>Add Work</h2>

<div class="grid">

<div id="workerBox">

<label>Worker</label>

<select id="workerSelect"></select>

</div>


<div>

<label>Customer Name</label>

<input
id="customer"
placeholder="Customer name">

</div>


<div>

<label>Location</label>

<input
id="location"
placeholder="Work location">

</div>


<div>

<label>Work Type</label>

<select id="workType">

<option>CCTV Installation</option>
<option>CCTV Service</option>
<option>CCTV Repair</option>
<option>DVR/NVR Setup</option>
<option>Camera Replacement</option>
<option>Networking</option>
<option>Other</option>

</select>

</div>


<div>

<label>Camera Quantity</label>

<input
id="cameraQty"
type="number"
min="0"
value="0">

</div>


<div>

<label>Status</label>

<select id="status">

<option>Pending</option>
<option>Completed</option>

</select>

</div>


<div class="full">

<label>Work Details</label>

<textarea
id="details"
rows="4"

id="material"
rows="3"
placeholder="Cable, camera, HDD, connector etc."></textarea>

style="margin-top:18px"
onclick="addWork()">
Save Work
</button>

</div>


<!-- ================= WORK HISTORY ================= -->

<div class="card">

<div style="
display:flex;
justify-content:space-between;
gap:10px;
align-items:center;
flex-wrap:wrap">

<h2 style="margin:0">
Work History
</h2>

<input
id="search"
style="max-width:300px"
placeholder="Search customer, worker, location..."
oninput="renderWorks()">

</div>

<div id="works"></div>

</div>


<!-- ================= ADMIN INVOICE ================= -->

<div
id="invoiceSection"
class="card hidden">

<h2>🧾 Create Invoice</h2>

<div class="grid">

<div>

<label>Invoice No.</label>

<input
id="invoiceNo"
readonly>

</div>

<div>

<label>Invoice Date</label>

<input
id="invoiceDate"
type="date">

</div>

<div>

<label>Customer Name</label>

<input
id="invCustomer"
placeholder="Customer name">

</div>

<div>

<label>Customer Mobile</label>

<input
id="invMobile"
placeholder="Mobile number">

</div>

<div class="full">

<label>Customer Address</label>

<textarea
id="invAddress"
rows="2"
placeholder="Address"></textarea>

</div>

</div>


<h3>
Items / Services
</h3>

<div id="invoiceItems"></div>

<button
type="button"
class="secondary"
onclick="addInvoiceItem()">
+ Add Item
</button>


<div class="grid" style="margin-top:10px">

<div>

<label>Discount</label>

<input
id="invDiscount"
type="number"
min="0"

oninput="calculateInvoice()">

</div>

<label>GST %</label>

id="invGst"
type="number"
min="0"

oninput="calculateInvoice()">

<select id="invPaymentStatus">

<option>Pending</option>
<option>Paid</option>
<option>Partial</option>

<select id="invPaymentMethod">

<option>UPI</option>
<option>Cash</option>
<option>Bank Transfer</option>
<option>Other</option>

</select>

</div>


<div class="invoice-total">

<div class="invoice-row">
<span>Subtotal</span>
<b id="invSubtotal">₹0.00</b>
</div>

<div class="invoice-row">
<span>Discount</span>
<b id="invDiscountTotal">₹0.00</b>
</div>

<div class="invoice-row">
<span>GST</span>
<b id="invGstTotal">₹0.00</b>
</div>

<div class="invoice-row invoice-grand">
<span>Grand Total</span>
<b id="invGrandTotal">₹0.00</b>
</div>

</div>


<div class="invoice-actions">

<button onclick="saveInvoice()">
💾 Save Invoice
</button>

<button
class="secondary"
onclick="printCurrentInvoice()">
🖨️ Print Invoice
</button>

</div>

<div id="invoiceMsg"></div>

</div>


<!-- ================= INVOICE HISTORY ================= -->

<div
id="invoiceHistorySection"
class="card hidden">

<div style="
display:flex;
justify-content:space-between;
gap:10px;
align-items:center;
flex-wrap:wrap">

<h2 style="margin:0">
Invoice History
</h2>

<input
id="invoiceSearch"
style="max-width:300px"
placeholder="Search invoice/customer..."
oninput="renderInvoices()">

</div>

<div id="invoices"></div>

</div>


<div id="printInvoice" class="hidden"></div>

</div>

</div>


<script type="module">

/* ================= FIREBASE ================= */

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
getDocs,
query,
orderBy,
serverTimestamp,
doc,
setDoc,
getDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyCqM1H3BhFYN3fglFnSBOzRB8IELQybtT4",

authDomain:
"kubera-tech-systems-598d2.firebaseapp.com",

projectId:
"kubera-tech-systems-598d2",

storageBucket:
"kubera-tech-systems-598d2.firebasestorage.app",

messagingSenderId:
"313849516281",

appId:
"1:313849516281:web:a143957e11e056c6321228"

};


const firebaseApp =
initializeApp(firebaseConfig);

const auth =
getAuth(firebaseApp);

const db =
getFirestore(firebaseApp);


let currentUser=null;
let currentRole="worker";

let allWorks=[];
let allUsers=[];
let allInvoices=[];


/* ================= ESCAPE ================= */

window.esc = function(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

};


/* ================= LOGIN PAGE ================= */

window.showLogin = function(){

document.getElementById("authForm").innerHTML=`

<label>Email</label>

<input
id="email"
type="email"
placeholder="Email">

<label>Password</label>

<input
id="password"
type="password"
placeholder="Password">

<button
style="width:100%;margin-top:18px"
onclick="login()">
Login
</button>

<div id="authMsg"></div>

`;

};


/* ================= REGISTER ================= */

window.showRegister = function(){

document.getElementById("authForm").innerHTML=`

<label>Name</label>

<input
id="regName"
placeholder="Worker name">

<label>Email</label>

<input
id="regEmail"
type="email"
placeholder="Email">

<label>Password</label>

<input
id="regPassword"
type="password"
placeholder="Minimum 6 characters">

<button
style="width:100%;margin-top:18px"
onclick="register()">
Create Account
</button>

<div id="authMsg"></div>

`;

};


/* ================= LOGIN ================= */

window.login = async function(){

const msg =
document.getElementById("authMsg");

msg.className="error";
msg.textContent="";

try{

const email =
document.getElementById("email")
.value
.trim();

const password =
document.getElementById("password")
.value;

if(!email || !password){

throw new Error(
"Email and Password are required."
);

}

await signInWithEmailAndPassword(
auth,
email,
password
);

}
catch(e){

msg.textContent =
e.message.replace("Firebase: ","");

}

};


/* ================= REGISTER ================= */

window.register = async function(){

const msg =
document.getElementById("authMsg");

msg.className="error";
msg.textContent="";

try{

const name =
document.getElementById("regName")
.value
.trim();

const email =
document.getElementById("regEmail")
.value
.trim()
.toLowerCase();

const password =
document.getElementById("regPassword")
.value;


if(!name)
throw new Error("Name is required.");

if(!email)
throw new Error("Email is required.");

if(password.length < 6)
throw new Error(
"Password must be at least 6 characters."
);


/* NEW ACCOUNTS ARE WORKERS */

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);


await setDoc(
doc(
db,
"users",
userCredential.user.uid
),
{
name:name,
email:email,
role:"worker",
createdAt:serverTimestamp()
}
);


msg.className="success";

msg.textContent=
"Account created successfully. You can now use the application.";

}
catch(e){

msg.textContent =
e.message.replace("Firebase: ","");

}

};


/* ================= LOGOUT ================= */

window.logout = function(){

signOut(auth);

};


/* ================= AUTH STATE ================= */

onAuthStateChanged(
auth,
async user=>{

if(!user){

currentUser=null;

document
.getElementById("loginPage")
.classList
.remove("hidden");

document
.getElementById("app")
.classList
.add("hidden");

return;

}


currentUser=user;

currentRole="worker";


try{

const snap =
await getDoc(
doc(
db,
"users",
user.uid
)
);


if(snap.exists()){

currentRole =
snap.data().role || "worker";

}
else{

/*
If user profile doesn't exist,
create a normal worker profile.
*/

await setDoc(
doc(
db,
"users",
user.uid
),
{
name:
user.email.split("@")[0],

email:user.email,

role:"worker",

createdAt:
serverTimestamp()
}
);

currentRole="worker";

}

}
catch(e){

console.error(e);

currentRole="worker";

}


/* SHOW APP */

document
.getElementById("loginPage")
.classList
.add("hidden");

document
.getElementById("app")
.classList
.remove("hidden");


document
.getElementById("roleText")
.textContent=
(
currentRole==="admin"
?
"ADMIN"
:
"WORKER"
)
+
" • "
+
user.email;


/* ADMIN ONLY */

document
.getElementById("workerBox")
.classList
.toggle(
"hidden",
currentRole!=="admin"
);


document
.getElementById("invoiceNav")
.classList
.toggle(
"hidden",
currentRole!=="admin"
);


await loadUsers();

await loadWorks();

if(currentRole==="admin"){

await loadInvoices();

}

});


/* ================= LOAD USERS ================= */

async function loadUsers(){

allUsers=[];

try{

const snap =
await getDocs(
collection(db,"users")
);

snap.forEach(x=>{

allUsers.push({
id:x.id,
...x.data()
});

});


const workerSelect =
document.getElementById(
"workerSelect"
);

workerSelect.innerHTML =
allUsers
.filter(x=>x.role==="worker")
.map(x=>
`
<option value="${esc(x.id)}">
${esc(x.name || x.email)}
</option>
`
)
.join("");

}
catch(e){

console.error(
"LOAD USERS ERROR",
e
);

}

}


/* ================= LOAD WORK ================= */

async function loadWorks(){

allWorks=[];

try{

const snap =
await getDocs(
query(
collection(db,"works"),
orderBy(
"createdAt",
"desc"
)
)
);

snap.forEach(x=>{

allWorks.push({
id:x.id,
...x.data()
});

});


/*
WORKER CAN SEE ONLY
THEIR OWN WORK
*/

if(currentRole!=="admin"){

allWorks =
allWorks.filter(
x =>
x.workerId ===
currentUser.uid
);

}

renderWorks();

}
catch(e){

console.error(
"LOAD WORK ERROR",
e
);

document.getElementById(
"works"
).innerHTML=
`
<p class="error">
Unable to load work data.
<br>
${esc(e.message)}
</p>
`;

}

}


/* ================= ADD WORK ================= */

window.addWork = async function(){

const msg =
document.getElementById("workMsg");

msg.className="error";
msg.textContent="";


try{

const customer =
document.getElementById("customer")
.value.trim();

const location =
document.getElementById("location")
.value.trim();

const details =
document.getElementById("details")
.value.trim();

const material =
document.getElementById("material")
.value.trim();


if(!customer)
throw new Error(
"Customer Name is required."
);

if(!location)
throw new Error(
"Location is required."
);

if(!details)
throw new Error(
"Work Details are required."
);


let workerId =
currentUser.uid;

let workerName =
currentUser.email;


/* ADMIN SELECTS WORKER */

if(currentRole==="admin"){

workerId =
document.getElementById(
"workerSelect"
).value;


if(!workerId)
throw new Error(
"Please select a worker."
);


const worker =
allUsers.find(
x=>x.id===workerId
);


if(worker){

workerName =
worker.name ||
worker.email;

}

}


/* WORKER */

else{

const worker =
allUsers.find(
x=>x.id===currentUser.uid
);


if(worker){

workerName =
worker.name ||
worker.email;

}

}


/* SAVE */

await addDoc(
collection(db,"works"),
{

workerId:workerId,

workerName:workerName,

customer:customer,

location:location,

workType:
document.getElementById(
"workType"
).value,

cameraQty:
Number(
document.getElementById(
"cameraQty"
).value || 0
),

status:
document.getElementById(
"status"
).value,

details:details,

material:material,

createdBy:
currentUser.uid,

createdAt:
serverTimestamp()

}
);


/* SUCCESS */

msg.className="success";

msg.textContent=
"✅ Work saved successfully.";


/* CLEAR */

document.getElementById(
"customer"
).value="";

document.getElementById(
"location"
).value="";

document.getElementById(
"details"
).value="";

document.getElementById(
"material"
).value="";

document.getElementById(
"cameraQty"
).value=0;


await loadWorks();

}
catch(e){

console.error(e);

msg.textContent=
"❌ "+e.message;

}

};


/* ================= RENDER WORKS ================= */

window.renderWorks = function(){

const search =
(
document.getElementById(
"search"
).value || ""
)
.toLowerCase();


const list =
allWorks.filter(w=>{

const text =
`
${w.workerName || ""}
${w.customer || ""}
${w.location || ""}
${w.workType || ""}
${w.details || ""}
`.toLowerCase();

return text.includes(search);

});


document.getElementById(
"totalCount"
).textContent=
list.length;


document.getElementById(
"pendingCount"
).textContent=
list.filter(
x=>x.status==="Pending"
).length;


document.getElementById(
"completedCount"
).textContent=
list.filter(
x=>x.status==="Completed"
).length;


document.getElementById(
"works"
).innerHTML =
list.length

?

list.map(w=>`

<div class="work">

<div class="worktop">

<div>

<b>
${esc(w.customer)}
</b>

<div class="muted">

${esc(w.workerName || "")}

•

${esc(w.location || "")}

</div>

</div>

<span class="badge">
${esc(w.status || "Pending")}
</span>

</div>


<p>

<b>
${esc(w.workType || "")}
</b>

•

Cameras:
${Number(w.cameraQty || 0)}

</p>


<div>
${esc(w.details || "")}
</div>


${
w.material
?
`
<p>
<b>Material:</b>
${esc(w.material)}
</p>
`
:
""
}


<div
class="muted"
style="margin-top:8px">

${
w.createdAt &&
w.createdAt.toDate
?
w.createdAt
.toDate()
.toLocaleString()
:
"Recently added"
}

</div>


${
currentRole==="admin"
?
`
<button
style="margin-top:12px"
onclick="createInvoiceFromWork('${w.id}')">

🧾 Create Invoice

</button>
`
:
""
}

</div>

`).join("")

:

"<p class='muted'>No work found.</p>";

};


/* ================= INVOICE HELPERS ================= */

function todayISO(){

return new Date()
.toISOString()
.slice(0,10);

}


function money(n){

return "₹"+
Number(n||0)
.toLocaleString(
"en-IN",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}


/* ================= INVOICE NUMBER ================= */

function nextInvoiceNumber(){

const numbers =
allInvoices
.map(
x =>
parseInt(
String(
x.invoiceNo || ""
)
.replace(/\D/g,""),
10
)
)
.filter(
Number.isFinite
);


const next =
numbers.length
?
Math.max(...numbers)+1
:
1;


return "KTS-"+
String(next)
.padStart(5,"0");

}


/* ================= SHOW INVOICES ================= */

window.showInvoices=function(){

if(currentRole!=="admin"){

alert(
"Only Admin can create invoices."
);

return;

}


document
.getElementById(

/* ================= ADD INVOICE ITEM ================= */

window.addInvoiceItem=function(
desc="",
qty=1,
rate=0
){

const wrap =
document.getElementById(
"invoiceItems"
);


const row =
document.createElement("div");


row.className=
"invoice-item";


row.innerHTML=`

<div>

<label>Description</label>

<input
class="inv-desc"
placeholder="CCTV Camera / Service"
value="${esc(desc)}"
oninput="calculateInvoice()">

</div>


<div>

<label>Qty</label>

<input
class="inv-qty"
type="number"
min="0"
value="${qty}"
oninput="calculateInvoice()">

</div>


<div>

<label>Rate</label>

<input
class="inv-rate"
type="number"
min="0"
value="${rate}"
oninput="calculateInvoice()">

</div>


<div>

<label>Amount</label>

<input
class="inv-amount"
readonly
value="${money(qty*rate)}">

</div>


<div>

<button
type="button"
class="danger"
onclick="this.closest('.invoice-item').remove();calculateInvoice()">

×
</button>

</div>

`;


wrap.appendChild(row);

calculateInvoice();

};


/* ================= CALCULATE INVOICE ================= */

window.calculateInvoice=function(){

let subtotal=0;


document
.querySelectorAll(".invoice-item")
.forEach(row=>{

const qty =
Number(
row.querySelector(".inv-qty")
.value || 0
);

const rate =
Number(
row.querySelector(".inv-rate")
.value || 0
);

const amount =
qty*rate;

row.querySelector(
".inv-amount"
).value=
money(amount);

subtotal += amount;

});


const discount =
Number(
document.getElementById(
"invDiscount"
).value || 0
);


const gstPercent =
Number(
document.getElementById(
"invGst"
).value || 0
);


const taxable =
Math.max(
0,
subtotal-discount
);


const gst =
taxable*gstPercent/100;


const grand =
taxable+gst;


document.getElementById(
"invSubtotal"
).textContent=
money(subtotal);


document.getElementById(
"invDiscountTotal"
).textContent=
money(discount);


document.getElementById(
"invGstTotal"
).textContent=
money(gst);


document.getElementById(
"invGrandTotal"
).textContent=
money(grand);

};


/* ================= CREATE INVOICE FROM WORK ================= */

window.createInvoiceFromWork=function(id){

if(currentRole!=="admin"){

alert(
"Only Admin can create invoices."
);

return;

}


const work =
allWorks.find(
x=>x.id===id
);


if(!work){

alert("Work not found.");

return;

}


showInvoices();


document.getElementById(
"invCustomer"
).value=
work.customer || "";


document.getElementById(
"invoiceItems"
).innerHTML="";


addInvoiceItem(
work.workType ||
"CCTV Service",
Number(work.cameraQty || 1),
0
);


calculateInvoice();

};


/* ================= SAVE INVOICE ================= */

window.saveInvoice=async function(){

if(currentRole!=="admin"){

alert(
"Only Admin can create invoices."
);

return;

}


const msg =
document.getElementById(
"invoiceMsg"
);

msg.className="error";
msg.textContent="";


try{

const invoiceNo =
document.getElementById(
"invoiceNo"
).value;


const invoiceDate =
document.getElementById(
"invoiceDate"
).value;


const customer =
document.getElementById(
"invCustomer"
).value.trim();


const mobile =
document.getElementById(
"invMobile"
).value.trim();


const address =
document.getElementById(
"invAddress"
).value.trim();


if(!customer){

throw new Error(
"Customer Name is required."
);

}


const items=[];


document
.querySelectorAll(".invoice-item")
.forEach(row=>{

const desc =
row.querySelector(
".inv-desc"
).value.trim();

const qty =
Number(
row.querySelector(
".inv-qty"
).value || 0
);

const rate =
Number(
row.querySelector(
".inv-rate"
).value || 0
);


if(desc){

items.push({
description:desc,
qty:qty,
rate:rate,
amount:qty*rate
});

}

});


if(!items.length){

throw new Error(
"Please add at least one invoice item."
);

}


const subtotal =
items.reduce(
(sum,item)=>
sum+item.amount,
0
);


const discount =
Number(
document.getElementById(
"invDiscount"
).value || 0
);


const gstPercent =
Number(
document.getElementById(
"invGst"
).value || 0
);


const taxable =
Math.max(
0,
subtotal-discount
);


const gst =
taxable*gstPercent/100;


const grandTotal =
taxable+gst;


await addDoc(
collection(
db,
"invoices"
),
{

invoiceNo,
invoiceDate,

customer,
mobile,
address,

items,

subtotal,
discount,
gstPercent,
gst,
grandTotal,

paymentStatus:
document.getElementById(
"invPaymentStatus"
).value,

paymentMethod:
document.getElementById(
"invPaymentMethod"
).value,

createdBy:
currentUser.uid,

createdAt:
serverTimestamp()

}
);


msg.className="success";

msg.textContent=
"✅ Invoice saved successfully.";


await loadInvoices();

}
catch(e){

console.error(e);

msg.textContent=
"❌ "+e.message;

}

};


/* ================= LOAD INVOICES ================= */

async function loadInvoices(){

allInvoices=[];

try{

const snap =
await getDocs(
query(
collection(db,"invoices"),
orderBy(
"createdAt",
"desc"
)
)
);


snap.forEach(x=>{

allInvoices.push({
id:x.id,
...x.data()
});

});


renderInvoices();

}
catch(e){

console.error(
"LOAD INVOICES ERROR",
e
);

}

}


/* ================= RENDER INVOICES ================= */

window.renderInvoices=function(){

if(currentRole!=="admin")
return;


const term =
(
document.getElementById(
"invoiceSearch"
).value || ""
)
.toLowerCase();


const list =
allInvoices.filter(x=>
`
${x.invoiceNo || ""}
${x.customer || ""}
${x.mobile || ""}
${x.paymentStatus || ""}
`.toLowerCase()
.includes(term)
);


document.getElementById(
"invoices"
).innerHTML =
list.length

?

list.map(inv=>`

<div class="invoice-card">

<div
style="
display:flex;
justify-content:space-between;
gap:10px;
flex-wrap:wrap">

<div>

<b>
${esc(inv.invoiceNo)}
</b>

<div class="muted">
${esc(inv.invoiceDate || "")}
</div>

</div>

<span class="badge">
${esc(inv.paymentStatus || "Pending")}
</span>

</div>


<p>
<b>Customer:</b>
${esc(inv.customer || "")}
</p>


<p>
<b>Total:</b>
${money(inv.grandTotal)}
</p>


<p class="muted">
${esc(inv.paymentMethod || "")}
</p>


<button
class="secondary"
onclick="printSavedInvoice('${inv.id}')">

🖨️ Print

</button>

</div>

`).join("")

:

"<p class='muted'>No invoices found.</p>";

};
