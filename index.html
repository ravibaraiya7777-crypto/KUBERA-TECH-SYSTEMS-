.muted{

.error{

.success{

.invoice-item{

.invoice-total{
  max-width:420px;

}
.invoice-row{
  display:flex;
  justify-content:space-between;
  padding:7px 0
}
.grand{
  border-top:2px solid #0f172a;
  font-size:20px;
  font-weight:bold
}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px
}

@media(max-width:700px){
  .grid,.stats{grid-template-columns:1fr}
  .full{grid-column:auto}
  .invoice-item{
    grid-template-columns:1fr 70px 100px 100px 45px;
    overflow-x:auto
  }
}

@media print{
  body *{visibility:hidden!important}
  #printArea,#printArea *{
    visibility:visible!important
  }
  #printArea{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    padding:25px;
    background:white
  }
}

</div><!-- PRINT AREA --><div id="printArea" class="hidden"></div><script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
getDoc,
setDoc,
doc,
query,
orderBy,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyCqM1H3BhFYN3fglFnSBOzRB8IELQybtT4",
authDomain:"kubera-tech-systems-598d2.firebaseapp.com",
projectId:"kubera-tech-systems-598d2",
storageBucket:"kubera-tech-systems-598d2.firebasestorage.app",
messagingSenderId:"313849516281",
appId:"1:313849516281:web:a143957e11e056c6321228"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const ADMIN_EMAIL="bravi8209@gmail.com";

let user=null;
let role="worker";
let users=[];
let works=[];
let invoices=[];


window.esc=function(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
};


function money(v){
return "₹"+Number(v||0).toLocaleString("en-IN",{
minimumFractionDigits:2,
maximumFractionDigits:2
});
}


window.showLogin=function(){

document.getElementById("authForm").innerHTML=`

<label>Email</label>
<input id="email" type="email" placeholder="Email">

<label>Password</label>
<input id="password" type="password" placeholder="Password">

<button style="width:100%;margin-top:18px" onclick="login()">
Login
</button>

<div id="authMsg"></div>
`;
};


window.showRegister=function(){

document.getElementById("authForm").innerHTML=`

<label>Name</label>
<input id="regName" placeholder="Worker name">

<label>Email</label>
<input id="regEmail" type="email" placeholder="Email">

<label>Password</label>
<input id="regPassword" type="password" placeholder="Minimum 6 characters">

<button style="width:100%;margin-top:18px" onclick="register()">
Create Account
</button>

<div id="authMsg"></div>
`;
};


window.login=async function(){

const msg=document.getElementById("authMsg");

try{

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!email||!password)
throw new Error("Email and Password required.");

await signInWithEmailAndPassword(auth,email,password);

}catch(e){

msg.className="error";
msg.textContent=e.message;

}
};


window.register=async function(){

const msg=document.getElementById("authMsg");

try{

const name=document.getElementById("regName").value.trim();
const email=document.getElementById("regEmail").value.trim().toLowerCase();
const password=document.getElementById("regPassword").value;

if(!name) throw new Error("Name required.");
if(password.length<6) throw new Error("Password must be at least 6 characters.");

if(email===ADMIN_EMAIL)
throw new Error("Admin account already exists. Please Login.");

const result=await createUserWithEmailAndPassword(
auth,email,password
);

await setDoc(
doc(db,"users",result.user.uid),
{
name,
email,
role:"worker",
createdAt:serverTimestamp()
}
);

msg.className="success";
msg.textContent="Account created successfully.";

}catch(e){

msg.className="error";
msg.textContent=e.message;

}
};


window.logout=function(){
signOut(auth);
};


onAuthStateChanged(auth,async u=>{

if(!u){

document.getElementById("loginPage").classList.remove("hidden");
document.getElementById("app").classList.add("hidden");
return;

}

user=u;

role=(u.email||"").toLowerCase()===ADMIN_EMAIL
?"admin"
:"worker";

try{

const snap=await getDoc(doc(db,"users",u.uid));

if(snap.exists()){

role=snap.data().role||role;

}else{

await setDoc(
doc(db,"users",u.uid),
{
name:u.email.split("@")[0],
email:u.email,
role,
createdAt:serverTimestamp()
}
);

}

}catch(e){

console.log(e);

}


document.getElementById("loginPage").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");

document.getElementById("roleText").textContent=
(role==="admin"?"ADMIN":"WORKER")+" • "+u.email;

document.getElementById("workerField")
.classList.toggle("hidden",role!=="admin");

document.getElementById("invoiceButton")
.classList.toggle("hidden",role!=="admin");

await loadUsers();
await loadWorks();

if(role==="admin")
await loadInvoices();

});


async function loadUsers(){

users=[];

const snap=await getDocs(collection(db,"users"));

snap.forEach(d=>{
users.push({id:d.id,...d.data()});
});

document.getElementById("workerSelect").innerHTML=
users
.filter(x=>x.role==="worker")
.map(x=>`<option value="${x.id}">
${esc(x.name||x.email)}
</option>`)
.join("");

}


async function loadWorks(){

works=[];

try{

const snap=await getDocs(
query(
collection(db,"works"),
orderBy("createdAt","desc")
)
);

snap.forEach(d=>{
works.push({id:d.id,...d.data()});
});

if(role!=="admin"){
works=works.filter(x=>x.workerId===user.uid);
}

renderWorks();

}catch(e){

document.getElementById("works").innerHTML=
`<p class="error">${esc(e.message)}</p>`;

}

}


window.saveWork=async function(){

const msg=document.getElementById("workMsg");

try{

const customer=document.getElementById("customer").value.trim();
const location=document.getElementById("location").value.trim();
const details=document.getElementById("details").value.trim();

if(!customer||!location||!details)
throw new Error("Customer, Location and Work Details required.");

let workerId=user.uid;
let workerName=user.email;

if(role==="admin"){

workerId=document.getElementById("workerSelect").value;

const w=users.find(x=>x.id===workerId);

if(w) workerName=w.name||w.email;

}else{

const w=users.find(x=>x.id===user.uid);

if(w) workerName=w.name||w.email;

}

await addDoc(
collection(db,"works"),
{
workerId,
workerName,
customer,
location,
workType:document.getElementById("workType").value,
cameraQty:Number(document.getElementById("cameraQty").value||0),
status:document.getElementById("workStatus").value,
details,
material:document.getElementById("material").value.trim(),
createdBy:user.uid,
createdAt:serverTimestamp()
}
);

msg.className="success";
msg.textContent="✅ Work saved.";

document.getElementById("customer").value="";
document.getElementById("location").value="";
document.getElementById("details").value="";
document.getElementById("material").value="";
document.getElementById("cameraQty").value=0;

await loadWorks();

}catch(e){

msg.className="error";
msg.textContent="❌ "+e.message;

}

};


window.renderWorks=function(){

const term=document.getElementById("searchWork").value.toLowerCase();

const list=works.filter(w=>
`${w.workerName||""} ${w.customer||""} ${w.location||""} ${w.workType||""}`
.toLowerCase()
.includes(term)
);

document.getElementById("totalWork").textContent=list.length;
document.getElementById("pendingWork").textContent=
list.filter(x=>x.status==="Pending").length;
document.getElementById("completedWork").textContent=
list.filter(x=>x.status==="Completed").length;

document.getElementById("works").innerHTML=list.length?

list.map(w=>`

<div class="work">

<div class="worktop">

<div>
<b>${esc(w.customer)}</b>
<div class="muted">
${esc(w.workerName||"")} • ${esc(w.location||"")}
</div>
</div>

<span class="badge">
${esc(w.status||"Pending")}
</span>

</div>

<p>
<b>${esc(w.workType||"")}</b>
• Cameras: ${Number(w.cameraQty||0)}
</p>

<div>${esc(w.details||"")}</div>

${w.material?
`<p><b>Material:</b> ${esc(w.material)}</p>`:""}

${
role==="admin"
?
`<button style="margin-top:12px"
onclick="invoiceFromWork('${w.id}')">
🧾 Create Invoice
</button>`
:""
}

</div>

`).join("")

:"<p class='muted'>No work found.</p>";

};


function invoiceNumber(){

let max=0;

invoices.forEach(i=>{

const n=parseInt(
String(i.invoiceNo||"").replace(/\D/g,"")
);

if(Number.isFinite(n)&&n>max)max=n;

});

return "KTS-"+String(max+1).padStart(5,"0");

}


window.openInvoices=function(){

if(role!=="admin")return;

document.getElementById("invoicePanel").classList.remove("hidden");
document.getElementById("invoiceHistory").classList.remove("hidden");

document.getElementById("invoiceNo").value=invoiceNumber();

document.getElementById("invoiceDate").value=
new Date().toISOString().slice(0,10);

document.getElementById("invoiceCustomer").value="";
document.getElementById("invoiceMobile").value="";
document.getElementById("invoiceAddress").value="";
document.getElementById("discount").value=0;
document.getElementById("gst").value=0;

document.getElementById("invoiceItems").innerHTML="";

addItem();

calculate();

document.getElementById("invoicePanel")
.scrollIntoView({behavior:"smooth"});

};


window.addItem=function(desc="",qty=1,rate=0){

const row=document.createElement("div");

row.className="invoice-item";

row.innerHTML=`

<div>
<label>Description</label>
<input class="itemDesc" value="${esc(desc)}"
oninput="calculate()">
</div>

<div>
<label>Qty</label>
<input class="itemQty" type="number" min="1"
value="${qty}" oninput="calculate()">
</div>

<div>
<label>Rate</label>
<input class="itemRate" type="number" min="0"
value="${rate}" oninput="calculate()">
</div>

<div>
<label>Amount</label>
<input class="itemAmount" readonly value="₹0.00">
</div>

<div>
<label>&nbsp;</label>
<button class="danger"
onclick="this.closest('.invoice-item').remove();calculate()">
✕
</button>
</div>

`;

document.getElementById("invoiceItems").appendChild(row);

calculate();

};


window.calculate=function(){

let subtotal=0;

document.querySelectorAll(".invoice-item").forEach(row=>{

const qty=Number(row.querySelector(".itemQty").value||0);
const rate=Number(row.querySelector(".itemRate").value||0);

const amount=qty*rate;

row.querySelector(".itemAmount").value=money(amount);

subtotal+=amount;

});

const discount=Number(document.getElementById("discount").value||0);
const gstPercent=Number(document.getElementById("gst").value||0);

const taxable=Math.max(0,subtotal-discount);
const gstAmount=taxable*gstPercent/100;
const total=taxable+gstAmount;

document.getElementById("subtotal").textContent=money(subtotal);
document.getElementById("discountTotal").textContent=money(discount);
document.getElementById("gstTotal").textContent=money(gstAmount);
document.getElementById("grandTotal").textContent=money(total);

return {subtotal,discount,gstPercent,gstAmount,total};

};


window.saveInvoice=async function(){

if(role!=="admin"){
alert("Only Admin can create invoice.");
return;
}

const msg=document.getElementById("invoiceMsg");

try{

const customer=document.getElementById("invoiceCustomer").value.trim();

if(!customer)
throw new Error("Customer name required.");

const items=[];

document.querySelectorAll(".invoice-item").forEach(row=>{

const description=row.querySelector(".itemDesc").value.trim();
const qty=Number(row.querySelector(".itemQty").value||0);
const rate=Number(row.querySelector(".itemRate").value||0);

if(description){
items.push({
description,
qty,
rate,
amount:qty*rate
});
}

});

if(!items.length)
throw new Error("Add at least one item.");

const t=calculate();

const data={

invoiceNo:document.getElementById("invoiceNo").value,
invoiceDate:document.getElementById("invoiceDate").value,

customer,
mobile:document.getElementById("invoiceMobile").value.trim(),
address:document.getElementById("invoiceAddress").value.trim(),

items,

subtotal:t.subtotal,
discount:t.discount,
gstPercent:t.gstPercent,
gst:t.gstAmount,
grandTotal:t.total,

paymentStatus:document.getElementById("paymentStatus").value,
paymentMethod:document.getElementById("paymentMethod").value,

createdBy:user.uid,
createdAt:serverTimestamp()

};

await addDoc(collection(db,"invoices"),data);

msg.className="success";
msg.textContent="✅ Invoice saved successfully.";

await loadInvoices();

}catch(e){

msg.className="error";
msg.textContent="❌ "+e.message;

}

};


window.invoiceFromWork=function(id){

if(role!=="admin")return;

const w=works.find(x=>x.id===id);

if(!w)return;

openInvoices();

document.getElementById("invoiceCustomer").value=w.customer||"";

document.getElementById("invoiceItems").innerHTML="";

addItem(w.workType||"CCTV Service",w.cameraQty||1,0);

calculate();

};


async function loadInvoices(){

invoices=[];

const snap=await getDocs(
query(
collection(db,"invoices"),
orderBy("createdAt","desc")
)
);

snap.forEach(d=>{
invoices.push({id:d.id,...d.data()});
});

renderInvoices();

}


function renderInvoices(){

document.getElementById("invoiceList").innerHTML=

invoices.length?

invoices.map(i=>`

<div class="invoice-card">

<b>${esc(i.invoiceNo)}</b>

<div class="muted">
${esc(i.invoiceDate||"")}
</div>

<p>
Customer: <b>${esc(i.customer||"")}</b>
</p>

<p>
Total: <b>${money(i.grandTotal)}</b>
</p>

<p>
Payment: ${esc(i.paymentStatus||"Pending")}
</p>

<button onclick='printSavedInvoice(${JSON.stringify(i).replace(/'/g,"&#39;")})'>
🖨️ Print
</button>

</div>

`).join("")

:"<p class='muted'>No invoices yet.</p>";

}


window.printInvoice=function(){

const items=[];

document.querySelectorAll(".invoice-item").forEach(row=>{

items.push({

description:row.querySelector(".itemDesc").value,
qty:row.querySelector(".itemQty").value,
rate:row.querySelector(".itemRate").value,
amount:Number(row.querySelector(".itemQty").value||0)*
Number(row.querySelector(".itemRate").value||0)

});

});

const t=calculate();

const data={

invoiceNo:document.getElementById("invoiceNo").value,
invoiceDate:document.getElementById("invoiceDate").value,
customer:document.getElementById("invoiceCustomer").value,
mobile:document.getElementById("invoiceMobile").value,
address:document.getElementById("invoiceAddress").value,
items,
subtotal:t.subtotal,
discount:t.discount,
gst:t.gstAmount,
grandTotal:t.total,
paymentStatus:document.getElementById("paymentStatus").value,
