<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KUBERA TECH SYSTEMS - Work Management</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a}
header{background:#0f172a;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:20px;font-weight:800}.muted{color:#64748b;font-size:13px}
header .muted{color:#cbd5e1}
button{border:0;border-radius:10px;padding:11px 15px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#475569}button.danger{background:#dc2626}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 3px 15px #0000000d}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-top:6px;background:#fff}
label{font-size:13px;font-weight:700;display:block;margin-top:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{background:#fff;padding:18px;border-radius:14px}.stat b{font-size:28px;display:block;margin-top:6px}
.work{border:1px solid #e2e8f0;border-radius:13px;padding:15px;margin-top:12px}
.worktop{display:flex;justify-content:space-between;gap:10px}.badge{padding:5px 9px;border-radius:20px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:bold}
.login{max-width:430px;margin:60px auto}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{flex:1}
.error{color:#dc2626;font-size:13px;margin-top:10px}.success{color:#15803d;font-size:13px;margin-top:10px}
.invoice-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.invoice-item{display:grid;grid-template-columns:2fr 90px 120px 120px 44px;gap:8px;align-items:end;margin-top:8px}
.invoice-total{max-width:420px;margin-left:auto;margin-top:15px}.invoice-row{display:flex;justify-content:space-between;padding:6px 0}
.invoice-grand{font-size:20px;font-weight:800;border-top:2px solid #0f172a;padding-top:10px}
.invoice-card{border:1px solid #e2e8f0;border-radius:13px;padding:15px;margin-top:12px}
.invoice-brand{font-size:24px;font-weight:800}.invoice-paper{max-width:800px;margin:auto;background:#fff;padding:28px}
@media(max-width:700px){
.grid,.stats{grid-template-columns:1fr}.full{grid-column:auto}.container{padding:12px}
.invoice-item{grid-template-columns:1fr 80px 100px 100px 44px;overflow-x:auto}
.invoice-total{max-width:none}header{padding:14px}
}
</style>
</head>
<body>

<div id="loginPage" class="container">
  <div class="card login">
    <div style="font-size:26px;font-weight:800">KUBERA TECH SYSTEMS</div>
    <p class="muted">Worker Work Management</p>
    <div class="tabs">
      <button onclick="showLogin()">Login</button>
      <button class="secondary" onclick="showRegister()">Create Account</button>
    </div>
    <div id="authForm"></div>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <div>
    <div class="brand">KUBERA TECH SYSTEMS</div>
    <div id="roleText" class="muted"></div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button id="invoiceNav" class="secondary hidden" onclick="showInvoices()">🧾 Invoices</button>
    <button class="secondary" onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">
  <div class="stats">
    <div class="stat">Total Work<b id="totalCount">0</b></div>
    <div class="stat">Pending<b id="pendingCount">0</b></div>
    <div class="stat">Completed<b id="completedCount">0</b></div>
  </div>

  <div class="card">
    <h2>Add Work</h2>
    <div class="grid">
      <div id="workerBox">
        <label>Worker</label><select id="workerSelect"></select>
      </div>
      <div><label>Customer Name</label><input id="customer" placeholder="Customer name"></div>
      <div><label>Location</label><input id="location" placeholder="Work location"></div>
      <div><label>Work Type</label>
        <select id="workType">
          <option>CCTV Installation</option><option>CCTV Service</option><option>CCTV Repair</option>
          <option>DVR/NVR Setup</option><option>Camera Replacement</option><option>Networking</option><option>Other</option>
        </select>
      </div>
      <div><label>Camera Quantity</label><input id="cameraQty" type="number" min="0" value="0"></div>
      <div><label>Status</label><select id="status"><option>Pending</option><option>Completed</option></select></div>
      <div class="full"><label>Work Details</label><textarea id="details" rows="4" placeholder="What work was done?"></textarea></div>
      <div class="full"><label>Material Used</label><textarea id="material" rows="3" placeholder="Cable, camera, HDD, connector etc."></textarea></div>
    </div>
    <button style="margin-top:18px" onclick="addWork()">Save Work</button>
    <div id="workMsg"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
      <h2 style="margin:0">Work History</h2>
      <input id="search" style="max-width:300px" placeholder="Search customer, worker, location..." oninput="renderWorks()">
    </div>
    <div id="works"></div>
  </div>

  <div id="invoiceSection" class="card hidden">
    <h2>🧾 Create Invoice</h2>
    <div class="grid">
      <div><label>Invoice No.</label><input id="invoiceNo" readonly></div>
      <div><label>Invoice Date</label><input id="invoiceDate" type="date"></div>
      <div><label>Customer Name</label><input id="invCustomer" placeholder="Customer name"></div>
      <div><label>Customer Mobile</label><input id="invMobile" placeholder="Mobile number"></div>
      <div class="full"><label>Customer Address</label><textarea id="invAddress" rows="2" placeholder="Address"></textarea></div>
    </div>

    <h3>Items / Services</h3>
    <div id="invoiceItems"></div>
    <button type="button" class="secondary" onclick="addInvoiceItem()">+ Add Item</button>

    <div class="grid" style="margin-top:10px">
      <div><label>Discount</label><input id="invDiscount" type="number" min="0" value="0" oninput="calculateInvoice()"></div>
      <div><label>GST %</label><input id="invGst" type="number" min="0" value="0" oninput="calculateInvoice()"></div>
      <div><label>Payment Status</label><select id="invPaymentStatus"><option>Pending</option><option>Paid</option><option>Partial</option></select></div>
      <div><label>Payment Method</label><select id="invPaymentMethod"><option>UPI</option><option>Cash</option><option>Bank Transfer</option><option>Other</option></select></div>
    </div>

    <div class="invoice-total">
      <div class="invoice-row"><span>Subtotal</span><b id="invSubtotal">₹0.00</b></div>
      <div class="invoice-row"><span>Discount</span><b id="invDiscountTotal">₹0.00</b></div>
      <div class="invoice-row"><span>GST</span><b id="invGstTotal">₹0.00</b></div>
      <div class="invoice-row invoice-grand"><span>Grand Total</span><b id="invGrandTotal">₹0.00</b></div>
    </div>

    <div class="invoice-actions">
      <button onclick="saveInvoice()">💾 Save Invoice</button>
      <button class="secondary" onclick="printCurrentInvoice()">🖨️ Print Invoice</button>
    </div>
    <div id="invoiceMsg"></div>
  </div>

  <div id="invoiceHistorySection" class="card hidden">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
      <h2 style="margin:0">Invoice History</h2>
      <input id="invoiceSearch" style="max-width:300px" placeholder="Search invoice/customer..." oninput="renderInvoices()">
    </div>
    <div id="invoices"></div>
  </div>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,addDoc,getDocs,query,orderBy,serverTimestamp,doc,setDoc,getDoc}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCqM1H3BhFYN3fglFnSBOzRB8IELQybtT4",
 authDomain:"kubera-tech-systems-598d2.firebaseapp.com",
 projectId:"kubera-tech-systems-598d2",
 storageBucket:"kubera-tech-systems-598d2.firebasestorage.app",
 messagingSenderId:"313849516281",
 appId:"1:313849516281:web:a143957e11e056c6321228"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const ADMIN_EMAIL="bravi8209@gmail.com";

let currentUser=null,currentRole="worker",allWorks=[],allUsers=[],allInvoices=[];

window.esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
window.showLogin=()=>{document.getElementById("authForm").innerHTML=`
<label>Email</label><input id="email" type="email" placeholder="Email">
<label>Password</label><input id="password" type="password" placeholder="Password">
<button style="width:100%;margin-top:18px" onclick="login()">Login</button><div id="authMsg"></div>`};
window.showRegister=()=>{document.getElementById("authForm").innerHTML=`
<label>Name</label><input id="regName" placeholder="Worker name">
<label>Email</label><input id="regEmail" type="email" placeholder="Email">
<label>Password</label><input id="regPassword" type="password" placeholder="Minimum 6 characters">
<button style="width:100%;margin-top:18px" onclick="register()">Create Account</button><div id="authMsg"></div>`};

window.login=async()=>{
 const msg=document.getElementById("authMsg");msg.className="error";msg.textContent="";
 try{
  const email=document.getElementById("email").value.trim().toLowerCase(),pw=document.getElementById("password").value;
  if(!email||!pw)throw Error("Email and Password are required.");
  await signInWithEmailAndPassword(auth,email,pw);
 }catch(e){msg.textContent=(e.message||"Login failed").replace("Firebase: ","");}
};

window.register=async()=>{
 const msg=document.getElementById("authMsg");msg.className="error";msg.textContent="";
 try{
  const name=document.getElementById("regName").value.trim(),email=document.getElementById("regEmail").value.trim().toLowerCase(),pw=document.getElementById("regPassword").value;
  if(!name)throw Error("Name is required."); if(!email)throw Error("Email is required."); if(pw.length<6)throw Error("Password must be at least 6 characters.");
  if(email===ADMIN_EMAIL)throw Error("Admin account already exists. Please Login.");
  const c=await createUserWithEmailAndPassword(auth,email,pw);
  await setDoc(doc(db,"users",c.user.uid),{name,email,role:"worker",createdAt:serverTimestamp()});
  msg.className="success";msg.textContent="Account created successfully.";
 }catch(e){msg.textContent=(e.message||"Registration failed").replace("Firebase: ","");}
};

window.logout=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
 if(!user){currentUser=null;document.getElementById("loginPage").classList.remove("hidden");document.getElementById("app").classList.add("hidden");showLogin();return;}
 currentUser=user;currentRole="worker";
 try{
  const snap=await getDoc(doc(db,"users",user.uid));
  if(snap.exists())currentRole=snap.data().role||"worker";
  else{
   currentRole=user.email.toLowerCase()===ADMIN_EMAIL?"admin":"worker";
   await setDoc(doc(db,"users",user.uid),{name:user.email.split("@")[0],email:user.email,role:currentRole,createdAt:serverTimestamp()});
  }
 }catch(e){currentRole=user.email.toLowerCase()===ADMIN_EMAIL?"admin":"worker";}
 document.getElementById("loginPage").classList.add("hidden");document.getElementById("app").classList.remove("hidden");
 document.getElementById("roleText").textContent=(currentRole==="admin"?"ADMIN":"WORKER")+" • "+user.email;
 document.getElementById("workerBox").classList.toggle("hidden",currentRole!=="admin");
 document.getElementById("invoiceNav").classList.toggle("hidden",currentRole!=="admin");
 await loadUsers();await loadWorks();if(currentRole==="admin")await loadInvoices();
});

async function loadUsers(){
 allUsers=[];const snap=await getDocs(collection(db,"users"));snap.forEach(x=>allUsers.push({id:x.id,...x.data()}));
 document.getElementById("workerSelect").innerHTML=allUsers.filter(x=>x.role==="worker").map(x=>`<option value="${esc(x.id)}">${esc(x.name||x.email)}</option>`).join("");
}

async function loadWorks(){
 allWorks=[];try{
  const snap=await getDocs(query(collection(db,"works"),orderBy("createdAt","desc")));
  snap.forEach(x=>allWorks.push({id:x.id,...x.data()}));
 }catch(e){
  const snap=await getDocs(collection(db,"works"));snap.forEach(x=>allWorks.push({id:x.id,...x.data()}));
  allWorks.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
 }
 if(currentRole!=="admin")allWorks=allWorks.filter(x=>x.workerId===currentUser.uid);
 renderWorks();
}

window.addWork=async()=>{
 const msg=document.getElementById("workMsg");msg.className="error";msg.textContent="";
 try{
  const customer=document.getElementById("customer").value.trim(),location=document.getElementById("location").value.trim(),details=document.getElementById("details").value.trim(),material=document.getElementById("material").value.trim();
  if(!customer||!location||!details)throw Error("Customer, Location and Work Details are required.");
  let workerId=currentUser.uid,workerName=currentUser.email;
  if(currentRole==="admin"){
   workerId=document.getElementById("workerSelect").value;if(!workerId)throw Error("Please select a worker.");
   const w=allUsers.find(x=>x.id===workerId);if(w)workerName=w.name||w.email;
  }else{const w=allUsers.find(x=>x.id===currentUser.uid);if(w)workerName=w.name||w.email;}
  await addDoc(collection(db,"works"),{workerId,workerName,customer,location,workType:document.getElementById("workType").value,cameraQty:Number(document.getElementById("cameraQty").value||0),status:document.getElementById("status").value,details,material,createdBy:currentUser.uid,createdAt:serverTimestamp()});
  msg.className="success";msg.textContent="✅ Work saved successfully.";
  ["customer","location","details","material"].forEach(id=>document.getElementById(id).value="");document.getElementById("cameraQty").value=0;await loadWorks();
 }catch(e){msg.textContent="❌ "+e.message;}
};

window.renderWorks=()=>{
 const term=(document.getElementById("search").value||"").toLowerCase();
 const list=allWorks.filter(w=>`${w.workerName||""} ${w.customer||""} ${w.location||""} ${w.workType||""} ${w.details||""}`.toLowerCase().includes(term));
 document.getElementById("totalCount").textContent=list.length;document.getElementById("pendingCount").textContent=list.filter(x=>x.status==="Pending").length;document.getElementById("completedCount").textContent=list.filter(x=>x.status==="Completed").length;
 document.getElementById("works").innerHTML=list.length?list.map(w=>`<div class="work"><div class="worktop"><div><b>${esc(w.customer)}</b><div class="muted">${esc(w.workerName||"")} • ${esc(w.location||"")}</div></div><span class="badge">${esc(w.status||"Pending")}</span></div><p><b>${esc(w.workType||"")}</b> • Cameras: ${Number(w.cameraQty||0)}</p><div>${esc(w.details||"")}</div>${w.material?`<p><b>Material:</b> ${esc(w.material)}</p>`:""}<div class="muted" style="margin-top:8px">${w.createdAt?.toDate?w.createdAt.toDate().toLocaleString():"Recently added"}</div>${currentRole==="admin"?`<button style="margin-top:12px" onclick="createInvoiceFromWork('${w.id}')">🧾 Create Invoice</button>`:""}</div>`).join(""):"<p class='muted'>No work found.</p>";
};

const todayISO=()=>new Date().toISOString().slice(0,10);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
function nextInvoiceNumber(){
 const nums=allInvoices.map(x=>parseInt(String(x.invoiceNo||"").replace(/\D/g,""),10)).filter(Number.isFinite);
 return "KTS-"+String((nums.length?Math.max(...nums):0)+1).padStart(5,"0");
}

window.showInvoices=()=>{
 if(currentRole!=="admin"){alert("Only Admin can create invoices.");return;}
 document.getElementById("invoiceSection").classList.remove("hidden");document.getElementById("invoiceHistorySection").classList.remove("hidden");
 document.getElementById("invoiceNo").value=nextInvoiceNumber();document.getElementById("invoiceDate").value=todayISO();
 document.getElementById("invCustomer").value="";document.getElementById("invMobile").value="";document.getElementById("invAddress").value="";
 document.getElementById("invDiscount").value=0;document.getElementById("invGst").value=0;document.getElementById("invPaymentStatus").value="Pending";document.getElementById("invPaymentMethod").value="UPI";
 document.getElementById("invoiceItems").innerHTML="";addInvoiceItem();calculateInvoice();document.getElementById("invoiceMsg").textContent="";
 document.getElementById("invoiceSection").scrollIntoView({behavior:"smooth"});
};

window.createInvoiceFromWork=id=>{
 if(currentRole!=="admin")return;
 const w=allWorks.find(x=>x.id===id);if(!w)return;showInvoices();
 document.getElementById("invCustomer").value=w.customer||"";document.getElementById("invoiceItems").innerHTML="";
 addInvoiceItem(w.workType||"CCTV Service",Number(w.cameraQty||1),0);calculateInvoice();
};

window.addInvoiceItem=(desc="",qty=1,rate=0)=>{
 const row=document.createElement("div");row.className="invoice-item";
 row.innerHTML=`<div><label>Description</label><input class="inv-desc" placeholder="CCTV Camera / Service" value="${esc(desc)}" oninput="calculateInvoice()"></div>
 <div><label>Qty</label><input class="inv-qty" type="number" min="1" value="${qty}" oninput="calculateInvoice()"></div>
 <div><label>Rate</label><input class="inv-rate" type="number" min="0" value="${rate}" oninput="calculateInvoice()"></div>
 <div><label>Amount</label><input class="inv-amount" readonly value="₹0.00"></div>
 <div><label>&nbsp;</label><button type="button" class="danger" onclick="this.closest('.invoice-item').remove();calculateInvoice()">✕</button></div>`;
 document.getElementById("invoiceItems").appendChild(row);calculateInvoice();
};

window.calculateInvoice=()=>{
 let subtotal=0;
 document.querySelectorAll(".invoice-item").forEach(row=>{const qty=Number(row.querySelector(".inv-qty").value||0),rate=Number(row.querySelector(".inv-rate").value||0),amount=qty*rate;row.querySelector(".inv-amount").value=money(amount);subtotal+=amount;});
 const discount=Number(document.getElementById("invDiscount").value||0),gstPercent=Number(document.getElementById("invGst").value||0),after=Math.max(0,subtotal-discount),gst=after*gstPercent/100,grand=after+gst;
 document.getElementById("invSubtotal").textContent=money(subtotal);document.getElementById("invDiscountTotal").textContent=money(discount);document.getElementById("invGstTotal").textContent=money(gst);document.getElementById("invGrandTotal").textContent=money(grand);
 return{subtotal,discount,gstPercent,gst,grandTotal:grand};
};

window.saveInvoice=async()=>{
 if(currentRole!=="admin"){alert("Only Admin can save invoices.");return;}
 const msg=document.getElementById("invoiceMsg");msg.className="error";msg.textContent="";
 try{
  const customer=document.getElementById("invCustomer").value.trim();if(!customer)throw Error("Customer Name is required.");
  const items=[];document.querySelectorAll(".invoice-item").forEach(row=>{const description=row.querySelector(".inv-desc").value.trim(),qty=Number(row.querySelector(".inv-qty").value||0),rate=Number(row.querySelector(".inv-rate").value||0);if(description)items.push({description,qty,rate,amount:qty*rate});});
  if(!items.length)throw Error("Please add at least one item.");
  const t=calculateInvoice();
  const data={invoiceNo:document.getElementById("invoiceNo").value,invoiceDate:document.getElementById("invoiceDate").value,customer,mobile:document.getElementById("invMobile").value.trim(),address:document.getElementById("invAddress").value.trim(),items,subtotal:t.subtotal,discount:t.discount,gstPercent:t.gstPercent,gst:t.gst,grandTotal:t.grandTotal,paymentStatus:document.getElementById("invPaymentStatus").value,paymentMethod:document.getElementById("invPaymentMethod").value,createdBy:currentUser.uid,createdAt:serverTimestamp()};
  await addDoc(collection(db,"invoices"),data);msg.className="success";msg.textContent="✅ Invoice saved successfully.";await loadInvoices();
  setTimeout(()=>printInvoiceData(data),200);
 }catch(e){msg.textContent="❌ "+e.message;}
};

async function loadInvoices(){
 allInvoices=[];try{
  const snap=await getDocs(query(collection(db,"invoices"),orderBy("createdAt","desc")));snap.forEach(x=>allInvoices.push({id:x.id,...x.data()}));
 }catch(e){const snap=await getDocs(collection(db,"invoices"));snap.forEach(x=>allInvoices.push({id:x.id,...x.data()}));}
 renderInvoices();
}
window.renderInvoices=()=>{
 const term=(document.getElementById("invoiceSearch").value||"").toLowerCase();
 const list=allInvoices.filter(x=>`${x.invoiceNo||""} ${x.customer||""} ${x.mobile||""}`.toLowerCase().includes(term));
 document.getElementById("invoices").innerHTML=list.length?list.map(inv=>`<div class="invoice-card"><b>${esc(inv.invoiceNo)}</b> • ${esc(inv.customer)}<div class="muted">${esc(inv.invoiceDate||"")} • ${money(inv.grandTotal)}</div><div style="margin-top:10px"><button onclick="printSavedInvoice('${inv.id}')">🖨️ Print</button></div></div>`).join(""):"<p class='muted'>No invoices found.</p>";
};

window.printCurrentInvoice=()=>{
 const t=calculateInvoice();
 const items=[];document.querySelectorAll(".invoice-item").forEach(row=>{const description=row.querySelector(".inv-desc").value.trim(),qty=Number(row.querySelector(".inv-qty").value||0),rate=Number(row.querySelector(".inv-rate").value||0);if(description)items.push({description,qty,rate,amount:qty*rate});});
 const data={invoiceNo:document.getElementById("invoiceNo").value,invoiceDate:document.getElementById("invoiceDate").value,customer:document.getElementById("invCustomer").value.trim(),mobile:document.getElementById("invMobile").value.trim(),address:document.getElementById("invAddress").value.trim(),items,subtotal:t.subtotal,discount:t.discount,gstPercent:t.gstPercent,gst:t.gst,grandTotal:t.grandTotal,paymentStatus:document.getElementById("invPaymentStatus").value,paymentMethod:document.getElementById("invPaymentMethod").value};
 if(!data.customer){alert("Customer Name is required.");return;} if(!data.items.length){alert("Please add at least one item.");return;}
 printInvoiceData(data);
};

window.printSavedInvoice=id=>{const inv=allInvoices.find(x=>x.id===id);if(inv)printInvoiceData(inv);};

function printInvoiceData(inv){
 const rows=(inv.items||[]).map(i=>`<tr><td>${esc(i.description)}</td><td>${i.qty}</td><td>${money(i.rate)}</td><td>${money(i.amount)}</td></tr>`).join("");
 const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(inv.invoiceNo||"Invoice")}</title>
 <style>
 body{font-family:Arial,sans-serif;margin:0;background:#eee;color:#111}.paper{width:794px;max-width:94%;margin:20px auto;background:#fff;padding:35px;box-shadow:0 0 8px #bbb}
 .top{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:18px}.name{font-size:26px;font-weight:800}.small{font-size:13px;color:#555}
 h2{text-align:center;margin:24px 0}.customer{margin:18px 0;padding:12px;background:#f5f5f5}
 table{width:100%;border-collapse:collapse;margin-top:18px}th,td{border:1px solid #ccc;padding:10px;text-align:left}th{background:#f1f1f1}
 .right{text-align:right}.totals{margin-left:auto;width:330px;margin-top:18px}.line{display:flex;justify-content:space-between;padding:6px 0}.grand{font-size:20px;font-weight:800;border-top:2px solid #111;margin-top:6px;padding-top:10px}
