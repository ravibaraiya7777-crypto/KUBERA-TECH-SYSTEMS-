<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KUBERA TECH SYSTEMS - Work Management</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#0f172a}
header{background:#0f172a;color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:20px;font-weight:700}.muted{color:#64748b;font-size:13px}
button{border:0;border-radius:10px;padding:11px 15px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#475569}button.danger{background:#dc2626}
.container{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 3px 15px #0000000d}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-top:6px;background:#fff}
label{font-size:13px;font-weight:700;display:block;margin-top:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.full{grid-column:1/-1}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;padding:18px;border-radius:14px}.stat b{font-size:28px;display:block;margin-top:6px}
.work{border:1px solid #e2e8f0;border-radius:13px;padding:15px;margin-top:12px}.worktop{display:flex;justify-content:space-between;gap:10px}.badge{padding:5px 9px;border-radius:20px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:bold}
img.workphoto{max-width:160px;border-radius:10px;margin-top:10px}.login{max-width:430px;margin:60px auto}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{flex:1}.error{color:#dc2626;font-size:13px;margin-top:10px}.success{color:#15803d;font-size:13px;margin-top:10px}
@media(max-width:700px){.grid,.stats{grid-template-columns:1fr}.full{grid-column:auto}header{padding:14px}.container{padding:12px}}
</style>
</head>
<body>

<div id="loginPage" class="container">
  <div class="card login">
    <div style="font-size:26px;font-weight:800">KUBERA TECH SYSTEMS</div>
    <p class="muted">Worker Work Management</p><p class="muted">Admin: use your existing Firebase account to Login.</p>
    <div class="tabs">
      <button id="loginTab" onclick="showLogin()">Login</button>
      <button class="secondary" id="registerTab" onclick="showRegister()">Create Account</button>
    </div>
    <div id="authForm">
      <label>Email</label><input id="email" type="email" placeholder="Email">
      <label>Password</label><input id="password" type="password" placeholder="Password">
      <button style="width:100%;margin-top:18px" onclick="login()">Login</button>
      <div id="authMsg"></div>
    </div>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <div><div class="brand">KUBERA TECH SYSTEMS</div><div id="roleText" class="muted" style="color:#cbd5e1"></div></div>
  <button class="secondary" onclick="logout()">Logout</button>
</header>
<div class="container">

  <div class="stats">
    <div class="stat">Total Work<b id="totalCount">0</b></div>
    <div class="stat">Pending<b id="pendingCount">0</b></div>
    <div class="stat">Completed<b id="completedCount">0</b></div>
  </div>

  <div class="card">
    <h2 id="formTitle">Add Work</h2>
    <div class="grid">
      <div id="workerBox">
        <label>Worker</label><select id="workerSelect"></select>
      </div>
      <div>
        <label>Customer Name</label><input id="customer" placeholder="Customer name">
      </div>
      <div>
        <label>Location</label><input id="location" placeholder="Work location">
      </div>
      <div>
        <label>Work Type</label>
        <select id="workType">
          <option>CCTV Installation</option><option>CCTV Service</option><option>CCTV Repair</option>
          <option>DVR/NVR Setup</option><option>Camera Replacement</option><option>Networking</option><option>Other</option>
        </select>
      </div>
      <div>
        <label>Camera Quantity</label><input id="cameraQty" type="number" min="0" value="0">
      </div>
      <div>
        <label>Status</label>
        <select id="status"><option>Pending</option><option>Completed</option></select>
      </div>
      <div class="full">
        <label>Work Details</label><textarea id="details" rows="4" placeholder="What work was done?"></textarea>
      </div>
      <div class="full">
        <label>Material Used</label><textarea id="material" rows="3" placeholder="Cable, camera, HDD, connector etc."></textarea>
      </div>
      <div class="full"><label>Work Photo</label><div class="muted" style="padding:12px;border:1px dashed #cbd5e1;border-radius:10px">Photo upload is disabled in the Free Firebase version.</div></div>
    </div>
    <button style="margin-top:18px" onclick="addWork()">Save Work</button>
    <div id="workMsg"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
      <h2 style="margin:0">Work History</h2>
      <input id="search" style="max-width:300px" placeholder="Search customer, worker, location..." oninput="renderWorks()">
    </div>
    <div id="works"></div>
  </div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqM1H3BhFYN3fglFnSBOzRB8IELQybtT4",
  authDomain: "kubera-tech-systems-598d2.firebaseapp.com",
  projectId: "kubera-tech-systems-598d2",
  storageBucket: "kubera-tech-systems-598d2.firebasestorage.app",
  messagingSenderId: "313849516281",
  appId: "1:313849516281:web:a143957e11e056c6321228"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
let currentUser=null, currentRole="worker", allWorks=[], allUsers=[];

window.showLogin=()=>{document.getElementById("authForm").innerHTML=`
<label>Email</label><input id="email" type="email" placeholder="Email">
<label>Password</label><input id="password" type="password" placeholder="Password">
<button style="width:100%;margin-top:18px" onclick="login()">Login</button><div id="authMsg"></div>`}
window.showRegister=()=>{document.getElementById("authForm").innerHTML=`
<label>Name</label><input id="regName" placeholder="Worker/Admin name">
<label>Email</label><input id="regEmail" type="email" placeholder="Email">
<label>Password</label><input id="regPassword" type="password" placeholder="Minimum 6 characters">

<button style="width:100%;margin-top:18px" onclick="register()">Create Account</button><div id="authMsg"></div>`}

window.login=async()=>{
  const msg=document.getElementById("authMsg"); msg.className="error"; msg.textContent="";
  try{await signInWithEmailAndPassword(auth,email.value,password.value)}
  catch(e){msg.textContent=(e.code?e.code+": ":"")+e.message.replace("Firebase: ","")}
}
window.register=async()=>{
  const msg=document.getElementById("authMsg"); msg.className="error";
  try{
    const name=document.getElementById("regName").value.trim(), em=document.getElementById("regEmail").value.trim().toLowerCase(), pw=document.getElementById("regPassword").value;
    const role = em === "bravi8209@gmail.com" ? "admin" : "worker";
    if(em === "bravi8209@gmail.com") throw new Error("Admin account already exists. Please use Login.");
    if(!name) throw new Error("Name is required");
    const c=await createUserWithEmailAndPassword(auth,em,pw);
    await setDoc(doc(db,"users",c.user.uid),{name,email:em,role,createdAt:serverTimestamp()});
    msg.className="success"; msg.textContent="Account created.";
  }catch(e){msg.textContent=(e.code?e.code+": ":"")+e.message.replace("Firebase: ","")}
}
window.logout=()=>signOut(auth);

onAuthStateChanged(auth, async user=>{
  if(!user)return;
  currentUser=user;
  const snap=await getDoc(doc(db,"users",user.uid));
  if(snap.exists()) currentRole=snap.data().role||"worker";
  else {await setDoc(doc(db,"users",user.uid),{name:user.email.split("@")[0],email:user.email,role:"worker",createdAt:serverTimestamp()});currentRole="worker";}
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("roleText").textContent=(currentRole==="admin"?"ADMIN":"WORKER")+" • "+user.email;
  document.getElementById("workerBox").classList.toggle("hidden",currentRole!=="admin");
  await loadUsers(); await loadWorks();
});

async function loadUsers(){
  allUsers=[]; const s=await getDocs(collection(db,"users"));
  s.forEach(x=>allUsers.push({id:x.id,...x.data()}));
  workerSelect.innerHTML=allUsers.filter(x=>x.role==="worker").map(x=>`<option value="${x.id}">${esc(x.name||x.email)}</option>`).join("");
}
async function loadWorks(){
  allWorks=[]; const q=query(collection(db,"works"),orderBy("createdAt","desc")); const s=await getDocs(q);
  s.forEach(x=>allWorks.push({id:x.id,...x.data()}));
  if(currentRole!=="admin") allWorks=allWorks.filter(x=>x.workerId===currentUser.uid);
  renderWorks();
}
window.addWork=async()=>{
  const msg=document.getElementById("workMsg"); msg.className="error"; msg.textContent="";
  try{
    if(!customer.value.trim()||!location.value.trim()||!details.value.trim()) throw new Error("Customer, Location and Work Details are required.");
    let workerId=currentUser.uid, workerName=currentUser.email;
    if(currentRole==="admin"){
      workerId=workerSelect.value;
      const w=allUsers.find(x=>x.id===workerId); workerName=w?(w.name||w.email):"Worker";
    }else{
      const w=allUsers.find(x=>x.id===currentUser.uid); workerName=w?(w.name||w.email):currentUser.email;
    }
    await addDoc(collection(db,"works"),{
      workerId,workerName,customer:customer.value.trim(),location:location.value.trim(),workType:workType.value,
      cameraQty:Number(cameraQty.value||0),status:status.value,details:details.value.trim(),material:material.value.trim(),
      createdAt:serverTimestamp(),createdBy:currentUser.uid
    });
    msg.className="success";msg.textContent="Work saved successfully.";
    ["customer","location","details","material"].forEach(id=>document.getElementById(id).value="");cameraQty.value=0;
    await loadWorks();
  }catch(e){msg.textContent=e.message}
}
window.renderWorks=()=>{
  const term=(document.getElementById("search").value||"").toLowerCase();
  const list=allWorks.filter(w=>(`${w.workerName} ${w.customer} ${w.location} ${w.workType} ${w.details}`).toLowerCase().includes(term));
  totalCount.textContent=list.length; pendingCount.textContent=list.filter(x=>x.status==="Pending").length; completedCount.textContent=list.filter(x=>x.status==="Completed").length;
  works.innerHTML=list.length?list.map(w=>`<div class="work">
    <div class="worktop"><div><b>${esc(w.customer)}</b><div class="muted">${esc(w.workerName||"")} • ${esc(w.location||"")}</div></div><span class="badge">${esc(w.status||"Pending")}</span></div>
    <p><b>${esc(w.workType||"")}</b> • Cameras: ${Number(w.cameraQty||0)}</p>
    <div>${esc(w.details||"")}</div>
    ${w.material?`<p><b>Material:</b> ${esc(w.material)}</p>`:""}
    
    <div class="muted" style="margin-top:8px">${w.createdAt?.toDate?w.createdAt.toDate().toLocaleString():"Recently added"}</div>
  </div>`).join(""):"<p class='muted'>No work found.</p>";
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script>
</body>
</html>
